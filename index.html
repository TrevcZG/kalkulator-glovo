<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona w trakcie prac</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Kontener karty */
        .card {
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 100%;
            animation: fadeIn 1s ease-in-out;
        }

        /* Animacja wejścia */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Ikona / Grafika zastępcza */
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            display: inline-block;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        /* Nagłówek */
        h1 {
            font-size: 26px;
            color: #1e3c72;
            margin-bottom: 15px;
            font-weight: 700;
        }

        /* Tekst opisowy */
        p {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Pasek postępu */
        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            width: 65%; 
            height: 100%;
            background: linear-gradient(90deg, #1e3c72, #2a5298);
            border-radius: 4px;
        }

        
        .footer-text {
            font-size: 13px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">🚧</div>
        <h1>Strona w trakcie prac</h1>
        <p>Wprowadzamy dla Ciebie coś nowego i wyjątkowego. Zajrzyj do nas niebawem, wszystko będzie gotowe wkrótce!</p>
        
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        
        <div class="footer-text">&copy; 2026 Wszelkie prawa zastrzeżone.</div>
    </div>

</body>
</html>
